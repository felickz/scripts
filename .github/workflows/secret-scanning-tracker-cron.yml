name: Secret Scanning Pattern Tracker (Cron)

on:
#   schedule:
#     - cron: "23 7 * * *" # Daily at 7:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/secret-scanning-state.json
          key: secret-scanning-state

      - name: Check for documentation changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache

          # Fetch latest commit SHAs for each source
          GH_DOCS_SHA=$(gh api '/repos/github/docs/commits?path=src/secret-scanning/data/pattern-docs/&per_page=1' \
            --jq '.[0].sha')

          ADO_PROVIDER_SHA=$(gh api '/repos/MicrosoftDocs/azure-devops-docs/commits?path=docs/repos/security/includes/provider-table.md&per_page=1' \
            --jq '.[0].sha')

          ADO_NONPROVIDER_SHA=$(gh api '/repos/MicrosoftDocs/azure-devops-docs/commits?path=docs/repos/security/includes/non-provider-table.md&per_page=1' \
            --jq '.[0].sha')

          echo "Current SHAs:"
          echo "  GitHub Docs:        $GH_DOCS_SHA"
          echo "  ADO Provider:       $ADO_PROVIDER_SHA"
          echo "  ADO Non-Provider:   $ADO_NONPROVIDER_SHA"

          # Load cached state (or empty defaults)
          CACHED_GH=""
          CACHED_ADO_P=""
          CACHED_ADO_NP=""
          if [ -f .cache/secret-scanning-state.json ]; then
            CACHED_GH=$(jq -r '.github_docs_sha // ""' .cache/secret-scanning-state.json)
            CACHED_ADO_P=$(jq -r '.ado_provider_sha // ""' .cache/secret-scanning-state.json)
            CACHED_ADO_NP=$(jq -r '.ado_non_provider_sha // ""' .cache/secret-scanning-state.json)
            echo "Cached SHAs:"
            echo "  GitHub Docs:        $CACHED_GH"
            echo "  ADO Provider:       $CACHED_ADO_P"
            echo "  ADO Non-Provider:   $CACHED_ADO_NP"
          else
            echo "No cached state found — first run, treating all as changed."
          fi

          # Compare
          CHANGES=""
          GH_CHANGED=false
          ADO_P_CHANGED=false
          ADO_NP_CHANGED=false

          if [ "$GH_DOCS_SHA" != "$CACHED_GH" ]; then
            GH_CHANGED=true
            CHANGES="${CHANGES}\n- **GitHub Pattern Docs** changed: [\`${CACHED_GH:0:7}\`→\`${GH_DOCS_SHA:0:7}\`](https://github.com/github/docs/compare/${CACHED_GH:-main}...${GH_DOCS_SHA})"
          fi
          if [ "$ADO_PROVIDER_SHA" != "$CACHED_ADO_P" ]; then
            ADO_P_CHANGED=true
            CHANGES="${CHANGES}\n- **ADO Provider Table** changed: [\`${CACHED_ADO_P:0:7}\`→\`${ADO_PROVIDER_SHA:0:7}\`](https://github.com/MicrosoftDocs/azure-devops-docs/compare/${CACHED_ADO_P:-main}...${ADO_PROVIDER_SHA})"
          fi
          if [ "$ADO_NONPROVIDER_SHA" != "$CACHED_ADO_NP" ]; then
            ADO_NP_CHANGED=true
            CHANGES="${CHANGES}\n- **ADO Non-Provider Table** changed: [\`${CACHED_ADO_NP:0:7}\`→\`${ADO_NONPROVIDER_SHA:0:7}\`](https://github.com/MicrosoftDocs/azure-devops-docs/compare/${CACHED_ADO_NP:-main}...${ADO_NONPROVIDER_SHA})"
          fi

          if [ "$GH_CHANGED" = "false" ] && [ "$ADO_P_CHANGED" = "false" ] && [ "$ADO_NP_CHANGED" = "false" ]; then
            echo "No changes detected. Skipping update."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected!"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          # Save new state
          cat > .cache/secret-scanning-state.json << EOF
{
  "github_docs_sha": "$GH_DOCS_SHA",
  "ado_provider_sha": "$ADO_PROVIDER_SHA",
  "ado_non_provider_sha": "$ADO_NONPROVIDER_SHA",
  "last_run": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
}
EOF

          # Build changelog for the PS1 script
          if [ -n "$CHANGES" ]; then
            printf "### Changes Detected — $(date -u +%%Y-%%m-%%d)\n$CHANGES\n" > /tmp/changelog.md
            cat /tmp/changelog.md
          fi

          # Save outputs for summary
          echo "gh_changed=$GH_CHANGED" >> "$GITHUB_OUTPUT"
          echo "ado_p_changed=$ADO_P_CHANGED" >> "$GITHUB_OUTPUT"
          echo "ado_np_changed=$ADO_NP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "gh_sha=$GH_DOCS_SHA" >> "$GITHUB_OUTPUT"
          echo "ado_p_sha=$ADO_PROVIDER_SHA" >> "$GITHUB_OUTPUT"
          echo "ado_np_sha=$ADO_NONPROVIDER_SHA" >> "$GITHUB_OUTPUT"

      - name: Save cached state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/secret-scanning-state.json
          key: secret-scanning-state-${{ github.run_id }}

      - name: Install PowerShell-yaml
        if: steps.check.outputs.has_changes == 'true'
        run: pwsh -c "Install-Module -Name PowerShell-yaml -Scope CurrentUser -Force -AcceptLicense"

      - name: Run Count-SecretScanningPatterns
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }}
        run: |
          if [ -f /tmp/changelog.md ]; then
            pwsh -File ./pwsh/Count-SecretScanningPatterns.ps1 -ChangeLogFile /tmp/changelog.md
          else
            pwsh -File ./pwsh/Count-SecretScanningPatterns.ps1
          fi

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🔍 Secret Scanning Pattern Tracker

          | Source | Status | Latest Commit |
          | --- | --- | --- |
          | GitHub Pattern Docs | ${{ steps.check.outputs.gh_changed == 'true' && '✅ Changed' || '⏸️ Unchanged' }} | `${{ steps.check.outputs.gh_sha }}` |
          | ADO Provider Table | ${{ steps.check.outputs.ado_p_changed == 'true' && '✅ Changed' || '⏸️ Unchanged' }} | `${{ steps.check.outputs.ado_p_sha }}` |
          | ADO Non-Provider Table | ${{ steps.check.outputs.ado_np_changed == 'true' && '✅ Changed' || '⏸️ Unchanged' }} | `${{ steps.check.outputs.ado_np_sha }}` |
          EOF
          else
            echo "## ⏸️ No changes detected — skipped update" >> "$GITHUB_STEP_SUMMARY"
          fi
